name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check GUI subsystem
        # Subsystem 2 = Windows GUI; 3 = console (would open a console window).
        run: objdump -p build/WindowDash.exe | grep -q "Subsystem.*00000002"

      - uses: actions/upload-artifact@v4
        with:
          name: WindowDash-${{ github.sha }}
          path: build/WindowDash.exe
          if-no-files-found: error
