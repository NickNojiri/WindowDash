name: CI

on:
  push:            # every branch, so a branch is checked before its PR
    tags: ["v*"]
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  mingw-cross:
    name: Windows build (MinGW cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j

  windows:
    name: Windows build, tests, smoke run (MSVC)
    runs-on: windows-latest
    permissions:
      contents: write   # attach the .exe to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke run (starts, stays up for 5 s, closes)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\Release\WindowDash.exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "WindowDash exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: WindowDash-${{ github.sha }}
          path: build/Release/WindowDash.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/WindowDash.exe
